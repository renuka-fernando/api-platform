#
# Platform API configuration — quickstart (file-based auth)
#
# This file is read by the Platform API (Go binary).
# Environment variables always override values set here.
#
# Default login: username = admin, password = admin
# Change the password hash before deploying to a shared environment.
# Generate a new hash: htpasswd -bnBC 12 "" <password> | tr -d ':\n'
# --------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
log_level = "INFO"   # DEBUG | INFO | WARN | ERROR
port      = "9243"

# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------
[database]
# driver = "sqlite3"          # "sqlite3" or "postgres"
# path   = "/app/data/api_platform.db"   # SQLite file path (ignored for postgres)

# PostgreSQL — uncomment when driver = "postgres"
# host     = "localhost"
# port     = 5432
# name     = "platform_api"
# user     = "platform_api"
# password = "change-me"
# ssl_mode = "disable"

# ---------------------------------------------------------------------------
# Authentication
# ---------------------------------------------------------------------------

# JWT (local HMAC) — issues signed tokens after file-based login.
# secret_key is auto-generated at startup when not set (ephemeral — sessions reset on restart).
# Set AUTH_JWT_SECRET_KEY env var or secret_key here to persist sessions across restarts.
[auth.jwt]
enabled = true
issuer  = "platform-api"

# IDP (JWKS-based) — disabled in quickstart mode.
# Enable and configure when using Asgardeo, Keycloak, Auth0, etc.
[auth.idp]
enabled = false

# File-based auth — local username/password login.
[auth.file_based]
enabled = false

[auth.file_based.organization]
id     = "99089a17-72e0-4dd8-a2f4-c8dfbb085295"
name   = "AP Organization"
handle = "ap-org"
region = "us"

[[auth.file_based.users]]
username      = "admin"
password_hash = "$2y$10$U2yKMwGamGwDoMu0hRPT7u8nCuP8z/qxHFOKV6dhIxkJN9NJ0eVQ."
scopes        = "ap:organization:manage ap:gateway:manage ap:gateway_custom_policy:manage ap:rest_api:manage ap:llm_provider:manage ap:llm_proxy:manage ap:mcp_proxy:manage ap:webbroker_api:manage ap:websub_api:manage ap:application:manage ap:subscription:manage ap:subscription_plan:manage ap:project:manage ap:llm_template:manage ap:devportal:manage ap:git:read ap:api_key:read"

# ---------------------------------------------------------------------------
# TLS
# ---------------------------------------------------------------------------
# [tls]
# cert_dir = "/app/data/certs"

# ---------------------------------------------------------------------------
# DevPortal integration — disable for standalone deployments
# ---------------------------------------------------------------------------
[default_devportal]
enabled = false

# ---------------------------------------------------------------------------
# Dual-write (intermediate v1 -> v2 bridge)
# ---------------------------------------------------------------------------
# When enabled, every v1 mutation is ALSO mirrored into the v2 database (via the shared
# migrationcore package) after the v1 write commits. v1 stays the source of truth and the
# rollback point; reads are always served from v1; a v2 failure never affects the REST
# response (it is logged + recorded in v2_dual_write_failures and later reconciled).
# Disabled ⇒ byte-for-byte stock v1 (no v2 connection is opened).
[dual_write]
enabled       = false                   # master switch
write_timeout = "2s"                     # bounds the in-line v2 write (statement/connect timeout)
epoch         = "2026-01-01T00:00:00Z"  # MUST equal the batch's -migration-epoch
source_tz     = "UTC"                    # MUST equal the batch's -source-tz
# Failures are recorded to an append-only JSONL FILE (never a v1-DB table), so v1 stays
# pristine. In HA point this at a per-replica persistent volume and gather all for reconcile.
failure_log   = "./data/v2_dual_write_failures.jsonl"

# v2 target database (same shape as [database]). Its subscription-token encryption key
# MUST be the same key v1 used, set BEFORE the backfill; do not change v1's key when
# enabling dual-write. Do NOT init the v2 schema from this build — dbmigrate owns it.
# [dual_write.database]
# driver   = "postgres"
# host     = "localhost"
# port     = 5432
# name     = "platform_api_v2"
# user     = "platform_api"
# password = "change-me"
# ssl_mode = "disable"
